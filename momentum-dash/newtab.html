<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Tab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>
  <div id="overlay"></div>

  <main>
    <section id="clock-block">
      <div id="greeting"></div>
      <div id="clock"></div>
      <div id="date"></div>
      <div id="quote"></div>
    </section>

    <section id="sound-block">
      <button class="sound-btn" data-sound="off" id="sound-off" title="Off">🔇</button>
      <button class="sound-btn" data-sound="white" title="White noise">🌫️</button>
      <button class="sound-btn" data-sound="rain" title="Rain">🌧️</button>
      <button class="sound-btn" data-sound="waves" title="Ocean waves">🌊</button>
      <input type="range" id="sound-volume" min="0" max="1" step="0.01" value="0.4">
    </section>

    <section id="todo-block">
      <h2>To-do</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a task and press Enter" autocomplete="off">
      </form>
      <ul id="todo-list"></ul>
    </section>
  </main>

  <button id="refresh-photo" title="New photo">↻</button>
  <div id="photo-credit"></div>

  <script src="script.js"></script>
</body>
</html>
